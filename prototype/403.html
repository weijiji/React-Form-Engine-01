<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 · 没有访问权限 · 动态表单引擎</title>
  <link rel="stylesheet" href="assets/app.css" />
  <style>
    .error-code { font-size: 96px; }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-wrap">
      <div class="error-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
      </div>
      <div class="error-code">403</div>
      <h1 class="error-title">你没有权限访问此页面</h1>
      <p class="error-desc">
        当前账号「李晨」不具备访问该资源的权限。<br />
        如需访问，请联系系统管理员为你分配相应角色，或切换至有权限的账号。
      </p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-primary" href="designer-templates.html">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          返回我的模板
        </a>
        <button class="btn" onclick="toast('已向系统管理员提交访问申请')">申请访问权限</button>
      </div>
    </div>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
