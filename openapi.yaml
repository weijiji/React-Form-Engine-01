openapi: 3.1.0
info:
  title: Form Engine API
  version: 0.1.0
  description: |
    Dynamic Form Engine — configuration-driven form building and approval workflows.

    All routes use the `/api/v1` prefix (see ADR-0005). This document is the
    hand-written API contract (spec-first, see ADR-0007) from which client/server
    TypeScript types are generated via `openapi-typescript`.

    SSE streams (notification push, work order 07) are intentionally not modelled
    here — OpenAPI 3.x has weak SSE support; they are described separately.

servers:
  - url: http://localhost:3001
    description: Local development server

tags:
  - name: system
    description: Operational endpoints (health, diagnostics)
  - name: templates
    description: Form template CRUD, checkout/checkin locking, and publishing
  - name: forms
    description: Form center — published forms a filler can start
  - name: instances
    description: Form instance lifecycle — create, autosave, submit, withdraw
  - name: auth
    description: JWT login/refresh/logout and the current-user endpoint
  - name: roles
    description: Role CRUD with permission-code assignment
  - name: permissions
    description: The predefined permission-code catalog
  - name: users
    description: User administration and role assignment
  - name: nl
    description: Natural-language form generation (ADR-0013)
  - name: approvers
    description: Approver options for approval-chain rules (designer)

paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Server health check
      description: Returns server health and database connectivity. 200 when healthy, 503 when degraded.
      operationId: getHealth
      responses:
        "200":
          description: Server and database healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Server up but database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/templates:
    post:
      tags: [templates]
      summary: Create a template
      description: |
        Creates a new draft template and auto-checks it out to the creator.
        The creator becomes the lock holder until they check in or an admin force-unlocks.
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "201":
          description: Template created and checked out to the creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormTemplate"
        "422":
          description: Missing or invalid `name`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [templates]
      summary: List templates
      description: |
        Offset-paginated list with optional category/status/search filters.
        `scope=mine` (default) returns only templates the caller created;
        `scope=all` returns every template and requires the `template:view_all`
        permission (403 FORBIDDEN otherwise).
      operationId: listTemplates
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, all]
            default: mine
          description: Visibility scope (default `mine`).
        - name: category
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring match on template name.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated template list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListResponse"
        "403":
          description: Caller requested `scope=all` without the `template:view_all` permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/templates/{id}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    get:
      tags: [templates]
      summary: Get template detail
      description: Returns the full template including schema and approval_chain.
      operationId: getTemplate
      responses:
        "200":
          description: Template found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormTemplate"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [templates]
      summary: Delete a template
      description: |
        Permanently deletes a **draft** template (status `draft` only). Published
        or archived templates cannot be deleted — instances reference them.
        Delete is gated by the `template:delete` permission code (403 FORBIDDEN)
        and the exclusive checkout lock: the caller must hold `locked_by`
        (409 TEMPLATE_LOCKED when the draft is not checked out to them).
      operationId: deleteTemplate
      responses:
        "204":
          description: Template deleted
        "400":
          description: Template is not in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller lacks the template:delete permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Template is not checked out to the caller (TEMPLATE_LOCKED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/templates/{id}/schema:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    put:
      tags: [templates]
      summary: Save template schema
      description: |
        Persists the form schema (and optional approval chain) for a draft or
        published template. Requires the caller to be the current lock holder
        (checked out); otherwise 409 TEMPLATE_LOCKED. Archived templates are
        read-only (400 TEMPLATE_ARCHIVED).
      operationId: saveTemplateSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSchemaRequest"
      responses:
        "200":
          description: Schema saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormTemplate"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Template is archived and cannot be edited (TEMPLATE_ARCHIVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Template locked by someone else or not checked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/templates/{id}/meta:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    patch:
      tags: [templates]
      summary: Edit template metadata
      description: |
        Updates the template's name / description / category. Requires the caller
        to be the current lock holder (checked out); otherwise 409 TEMPLATE_LOCKED.
        Archived templates are read-only (400 TEMPLATE_ARCHIVED). The update bumps
        the optimistic-lock `version`.
      operationId: updateTemplateMeta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTemplateMetaRequest"
      responses:
        "200":
          description: Metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormTemplate"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Template is archived (TEMPLATE_ARCHIVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Template locked by someone else or not checked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Invalid `name` (blank when provided)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/templates/{id}/checkout:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      tags: [templates]
      summary: Check out a template
      description: |
        Acquires the exclusive edit lock. Draft and published templates can be checked
        out (a published template stays `published` while edited, so the fill-in entry
        stays live); archived templates are read-only and rejected (400 TEMPLATE_ARCHIVED).
        Idempotent for the current holder.
      operationId: checkoutTemplate
      responses:
        "200":
          description: Checked out (or already held by caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormTemplate"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Template is archived and cannot be edited (TEMPLATE_ARCHIVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Template already locked by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/templates/{id}/checkin:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      tags: [templates]
      summary: Check in a template
      description: Releases the edit lock. Only the current holder may check in (admin override lands with auth, issue 09).
      operationId: checkinTemplate
      responses:
        "200":
          description: Lock released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormTemplate"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Template locked by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/templates/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      tags: [templates]
      summary: Publish or re-publish a template
      description: |
        First publish transitions `draft → published` (no lock needed). Re-publishing a
        published template in place (`published → published`, schema overwritten) requires
        the caller to hold the checkout lock. Both are one atomic status update that clears
        the lock and bumps the optimistic-lock `version`. Archived templates can never be
        published (400 TEMPLATE_ARCHIVED).
      operationId: publishTemplate
      responses:
        "200":
          description: Template published (or re-published)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormTemplate"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Template is archived (TEMPLATE_ARCHIVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Published template re-published without holding the lock, or the state changed mid-flight (TEMPLATE_LOCKED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/templates/{id}/force-unlock:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    post:
      tags: [templates]
      summary: Force-unlock a template
      description: "Admin-only: clears the edit lock regardless of the current holder. Role enforcement lands with auth (issue 09)."
      operationId: forceUnlockTemplate
      responses:
        "200":
          description: Lock cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormTemplate"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/forms:
    get:
      tags: [forms]
      summary: List published forms
      description: |
        Lists the forms a filler can start — only *published* templates. Supports
        category + search filters and offset pagination.
      operationId: listForms
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring match on form name.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of published forms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormListResponse"

  /api/v1/instances:
    post:
      tags: [instances]
      summary: Create a draft instance
      description: Starts a new form for a published template. The instance begins in `draft` status.
      operationId: createInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceRequest"
      responses:
        "201":
          description: Draft instance created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetail"
        "400":
          description: Template not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Template not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/instances/my:
    get:
      tags: [instances]
      summary: List my instances
      description: |
        Drafts and submissions owned by the acting user, newest first. Optional
        comma-separated status filter.
      operationId: listMyInstances
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: Comma-separated status filter, e.g. `draft,submitted`.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated list of the user's instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceListResponse"

  /api/v1/instances/{id}:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    get:
      tags: [instances]
      summary: Get instance detail
      description: |
        Returns the instance plus its approval records and the live template.
        Drafts render against `template.schema`; submitted instances carry a frozen
        `template_snapshot`.
      operationId: getInstance
      responses:
        "200":
          description: Instance found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetail"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/instances/{id}/values:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    put:
      tags: [instances]
      summary: Autosave field values
      description: |
        Persists field values on a draft instance without bumping the optimistic
        lock version. Rejects non-draft instances.
      operationId: saveInstanceValues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveValuesRequest"
      responses:
        "200":
          description: Values saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormInstance"
        "400":
          description: Instance is not in draft status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the owner of the instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/instances/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [instances]
      summary: Submit an instance
      description: |
        Validates the field values against the current template schema and
        atomically submits (ADR-0001): the instance update, frozen snapshot, and
        approval-record inserts commit together; approver resolution runs inside
        that transaction. Notifications persist async after commit.
      operationId: submitInstance
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRequest"
      responses:
        "200":
          description: Submitted (status submitted, or approved when no approvers)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetail"
        "400":
          description: Not a draft/withdrawn instance or template not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the owner of the instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Already submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Field validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Approver resolution failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/instances/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/InstanceId"
    post:
      tags: [instances]
      summary: Withdraw a submitted instance
      description: |
        Reverts a `submitted`/`in_approval` instance back to draft. Optimistic
        locking on `version` (409 VERSION_CONFLICT); rejected if any approver has
        already acted (400 APPROVAL_NOT_PENDING).
      operationId: withdrawInstance
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawRequest"
      responses:
        "200":
          description: Withdrawn (back to draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDetail"
        "400":
          description: Not a withdrawable status, or an approver already acted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the owner of the instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Optimistic-lock version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in
      description: |
        Verifies email + password, then issues a httpOnly JWT (`access_token`,
        Secure + SameSite=Strict) and a JS-readable CSRF token (`xsrf-token`).
        Rate-limited to 5 requests per minute per client IP.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; returns the user with roles + permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Wrong credentials (uniform, no user enumeration)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh the session (sliding expiration)
      description: Exchanges the current token for a fresh 7-day token.
      operationId: refresh
      responses:
        "200":
          description: New token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: Clears the access_token and xsrf-token cookies.
      operationId: logout
      responses:
        "204":
          description: Cookies cleared

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user
      description: The authenticated user with their roles and permission codes.
      operationId: getAuthMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/roles:
    get:
      tags: [roles]
      summary: List roles
      description: |
        All roles with their permission codes. Requires admin:manage_roles OR
        admin:manage_users. Callers holding only admin:manage_users receive a
        reduced catalog — every role carrying no admin-class (管理) permission,
        i.e. the roles they may grant.
      operationId: listRoles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "403":
          description: Missing admin:manage_roles or admin:manage_users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [roles]
      summary: Create a role
      description: Creates a role with at least one permission code.
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "403":
          description: Missing admin:manage_roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Invalid name or permission codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/RoleId"
    put:
      tags: [roles]
      summary: Update a role
      description: Replaces name/description and optionally the permission codes.
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [roles]
      summary: Delete a role
      description: Deletes the role and cascades its user/permission assignments.
      operationId: deleteRole
      responses:
        "204":
          description: Role deleted
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/permissions:
    get:
      tags: [permissions]
      summary: List permission codes
      description: The 21 predefined permission codes, grouped by category.
      operationId: listPermissions
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponse"

  /api/v1/approvers/options:
    get:
      tags: [approvers]
      summary: List approver options (users + roles)
      description: |
        Real active users and roles the designer's approval-chain editor offers
        for 指定人员 / 指定角色 rules, so designed chains carry real UUIDs.
        Requires template:create or template:edit.
      operationId: getApproverOptions
      responses:
        "200":
          description: Users and roles available as approvers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproverOptionListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Lacks template:create / template:edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/users:
    get:
      tags: [users]
      summary: List users
      description: |
        Offset-paginated list with optional search/role/status filters.
        Requires admin:manage_users.
      operationId: listUsers
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive substring match on name or email.
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter to users holding this role.
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
          description: Filter by enabled/disabled state.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
    post:
      tags: [users]
      summary: Create a user
      description: |
        Creates a user with an initial password and optional initial roles.
        Requires admin:manage_users. A full role manager may assign any role;
        other callers may not assign roles carrying admin-class (管理)
        permissions (403 FORBIDDEN otherwise).
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Missing or invalid name, email, or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/users/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      summary: Get a user's roles
      operationId: getUserRoles
      responses:
        "200":
          description: The user's roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      tags: [users]
      summary: Replace a user's roles
      description: |
        Replaces the user's role set (capabilities are the union). Requires
        admin:manage_users. A full role manager may assign any role; other
        callers may not assign roles carrying admin-class (管理) permissions
        (403 FORBIDDEN otherwise — prevents privilege escalation).
      operationId: setUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignmentRequest"
      responses:
        "200":
          description: The user's new roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [users]
      summary: Update a user's name, email, or active state
      description: |
        Partial update — omitted fields are left unchanged. Setting is_active=false
        is guarded against self-operation and the last admin (409). Requires
        admin:manage_users.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email taken, self-operation, or last admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Invalid name or email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [users]
      summary: Delete a user
      description: |
        Hard-deletes a user. Rejected (409) for self-operation, the last admin,
        or a user who created templates. Requires admin:manage_users.
      operationId: deleteUser
      responses:
        "204":
          description: User deleted
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Self-operation, last admin, or user has templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/nl/generate:
    post:
      tags: [nl]
      summary: Generate a form-structure suggestion from a natural-language request
      description: |
        Asks the LLM to turn a natural-language description into a
        FormStructureSuggestion. When the LLM is unconfigured, fails, or returns
        an unusable structure, the server falls back to the local rule engine;
        when that also misses, `suggestion` is `null` and the client guides the
        user (ADR-0013). Requires `template:create`.
      operationId: generateSuggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NlGenerateRequest"
      responses:
        "200":
          description: Suggestion generated (or null when nothing matched)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NlGenerateResponse"
        "422":
          description: Missing or blank `message`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller lacks the template:create permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/nl/refine:
    post:
      tags: [nl]
      summary: Refine a suggestion with a follow-up message
      description: |
        Sends the current suggestion plus a follow-up message to the LLM and
        returns a revised suggestion. Requires the LLM to be configured
        (503 NL_UNAVAILABLE otherwise) and `template:create`.
      operationId: refineSuggestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NlRefineRequest"
      responses:
        "200":
          description: Revised suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NlRefineResponse"
        "422":
          description: Missing/blank `message`, or a malformed `suggestion`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: The LLM call failed (NL_GENERATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: The LLM is not configured (NL_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Caller lacks the template:create permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    ErrorEnvelope:
      type: object
      description: Standard error shape returned by the unified error handler and 404 catch-all.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code, e.g. NOT_FOUND, VALIDATION_ERROR.
            message:
              type: string
              description: Human-readable message (Chinese in the MVP).

    HealthResponse:
      type: object
      required: [status, db, timestamp, uptime, env]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [connected, disconnected]
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
          description: Process uptime in seconds.
        env:
          type: string
          description: Runtime environment, e.g. development, production.

    FormTemplate:
      type: object
      description: A form template (configuration, not a filled form). Mirrors the form_templates table.
      required: [id, name, version, status, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]
        version:
          type: integer
          description: Optimistic-locking version (INT), not the schema format version.
        schema:
          type: object
          additionalProperties: true
          description: Form structure (JSONB) — sections, fields, validation, conditions. Root contains schemaVersion.
        approval_chain:
          type: [object, "null"]
          description: Approval chain configuration (JSONB) — nodes array.
        status:
          type: string
          enum: [draft, published, archived]
        locked_by:
          type: [string, "null"]
          format: uuid
        locked_at:
          type: [string, "null"]
          format: date-time
        locked_by_name:
          type: [string, "null"]
          description: Display name of the current lock holder (resolved for the designer's checkout badge).
        created_by:
          type: string
          format: uuid
        created_by_name:
          type: [string, "null"]
          description: Display name of the template's creator (resolved for admin/ops read-only full views).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateTemplateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Display name (required).
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]
        schema:
          type: object
          additionalProperties: true
          description: Initial form structure (JSONB). Defaults to an empty schema.
        approval_chain:
          type: [object, "null"]
          description: Initial approval chain (JSONB).

    SaveSchemaRequest:
      type: object
      required: [schema]
      properties:
        schema:
          type: object
          additionalProperties: true
          description: Form structure (JSONB). Root must contain schemaVersion.
        approval_chain:
          type: [object, "null"]
          description: Approval chain (JSONB). Replaces the stored chain when present.

    UpdateTemplateMetaRequest:
      type: object
      description: Partial update of template metadata (name/description/category). Omitted fields are left unchanged.
      properties:
        name:
          type: string
          description: Display name (must be non-empty when provided).
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]

    TemplateListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FormTemplate"
        total:
          type: integer
          description: Total number of templates matching the filters (ignoring pagination).
        page:
          type: integer
        pageSize:
          type: integer

    User:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      description: The authenticated user with roles, permission codes, and (on login/refresh) the CSRF token.
      required: [id, name, email, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"
        permissions:
          type: array
          description: Union of permission codes across the user's roles.
          items:
            type: string
        csrfToken:
          type: string
          description: Fresh CSRF token echoed in the body (also set as the xsrf-token cookie).

    RoleSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]

    Role:
      type: object
      required: [id, name, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        permissions:
          type: array
          description: Permission codes assigned to this role.
          items:
            type: string
        created_at:
          type: string
          format: date-time

    RoleRequest:
      type: object
      required: [name, permissionCodes]
      properties:
        name:
          type: string
        description:
          type: [string, "null"]
        permissionCodes:
          type: array
          description: At least one permission code is required on create.
          items:
            type: string

    RoleListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"

    Permission:
      type: object
      required: [id, code, name, category]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        category:
          type: string

    PermissionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    ApproverOption:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ApproverOptionListResponse:
      type: object
      required: [users, roles]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/ApproverOption"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/ApproverOption"

    AdminUser:
      type: object
      required: [id, name, email, is_active, roles]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"

    UserListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
          description: Total number of users matching the filters (ignoring pagination).
        page:
          type: integer
        pageSize:
          type: integer

    RoleAssignmentRequest:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items:
            type: string
            format: uuid

    UserCreateRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          description: Initial password (hashed server-side via PBKDF2).
        roleIds:
          type: array
          description: Optional initial roles.
          items:
            type: string
            format: uuid

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        is_active:
          type: boolean

    FormInstance:
      type: object
      description: A filled form submission at runtime. Mirrors the form_instances table.
      required: [id, template_id, template_snapshot, field_values, status, current_node_index, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        template_snapshot:
          type: object
          additionalProperties: true
          description: Frozen copy of the template schema at submission time.
        field_values:
          type: object
          additionalProperties: true
          description: User-filled field values (JSONB).
        status:
          type: string
          enum: [draft, submitted, in_approval, approved, rejected, returned, withdrawn]
        current_node_index:
          type: integer
          description: Current approval node index (0-based).
        version:
          type: integer
          description: Optimistic-locking version.
        submitted_by:
          type: [string, "null"]
          format: uuid
        submitted_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApprovalRecord:
      type: object
      description: A single approval node execution record. Mirrors the approval_records table.
      required: [id, instance_id, node_id, node_order, action, created_at]
      properties:
        id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        node_id:
          type: string
          description: Approval node ID from the approval_chain.
        node_order:
          type: integer
          description: Sequential order in the chain.
        approver_id:
          type: [string, "null"]
          format: uuid
        action:
          type: string
          enum: [pending, approved, rejected, returned, transferred]
        comment:
          type: [string, "null"]
        transferred_from:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        acted_at:
          type: [string, "null"]
          format: date-time

    Notification:
      type: object
      description: A message triggered by a business event. Mirrors the notifications table.
      required: [id, recipient_id, type, title, is_read, created_at]
      properties:
        id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - instance_submitted
            - instance_approved
            - instance_rejected
            - instance_returned
            - instance_transferred
            - instance_withdrawn
            - instance_completed
        title:
          type: string
        content:
          type: [string, "null"]
        ref_type:
          type: [string, "null"]
          description: Associated entity type (instance | template).
        ref_id:
          type: [string, "null"]
          format: uuid
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    TemplateSummary:
      type: object
      description: A reduced template view embedded in instance/draft detail responses.
      required: [id, name, status, schema, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        schema:
          type: object
          additionalProperties: true
        approval_chain:
          type: [object, "null"]
        updated_at:
          type: string
          format: date-time

    FormSummary:
      type: object
      description: A published form in the form center list.
      required: [id, name, schema, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]
        schema:
          type: object
          additionalProperties: true
        approval_chain:
          type: [object, "null"]
        updated_at:
          type: string
          format: date-time

    FormListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FormSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ApprovalRecordSummary:
      type: object
      description: An approval record with the approver's display name resolved.
      required: [id, node_id, node_order, action]
      properties:
        id:
          type: string
          format: uuid
        node_id:
          type: string
        node_order:
          type: integer
        approver_id:
          type: [string, "null"]
          format: uuid
        approver_name:
          type: [string, "null"]
        action:
          type: string
          enum: [pending, approved, rejected, returned, transferred]
        comment:
          type: [string, "null"]
        acted_at:
          type: [string, "null"]
          format: date-time

    InstanceDetail:
      type: object
      description: A FormInstance enriched with approval progress and the live template.
      allOf:
        - $ref: "#/components/schemas/FormInstance"
        - type: object
          required: [approval_records, template]
          properties:
            approval_records:
              type: array
              items:
                $ref: "#/components/schemas/ApprovalRecordSummary"
            template:
              $ref: "#/components/schemas/TemplateSummary"
            _orphaned:
              type: object
              additionalProperties: true
              description: Draft-status only. Field values moved out after best-effort fieldId migration (ADR-0004). Absent otherwise.
            version_mismatch:
              type: boolean
              description: Draft-status only. True when fieldId migration moved any values (ADR-0004). Absent otherwise.

    InstanceListItem:
      type: object
      description: A FormInstance with the template display name resolved.
      allOf:
        - $ref: "#/components/schemas/FormInstance"
        - type: object
          properties:
            template_name:
              type: [string, "null"]

    InstanceListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceListItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CreateInstanceRequest:
      type: object
      required: [template_id]
      properties:
        template_id:
          type: string
          format: uuid
        field_values:
          type: object
          additionalProperties: true
          description: Optional initial field values.

    SaveValuesRequest:
      type: object
      required: [field_values]
      properties:
        field_values:
          type: object
          additionalProperties: true

    SubmitRequest:
      type: object
      properties:
        field_values:
          type: object
          additionalProperties: true
          description: Final values to submit; defaults to the last autosaved values.

    WithdrawRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          description: Expected optimistic-lock version (required); a mismatch yields 409 VERSION_CONFLICT.

    FormStructureSuggestion:
      type: object
      description: |
        AI 生成的、用户可编辑确认的中间结构（CONTEXT.md「表单结构建议」）。
        不是引擎 schema —— 不含 schemaVersion、字段 id、验证规则；type 为受限枚举，
        翻译时未识别一律落为 text（ADR-0013）。
      required: [name, sections]
      properties:
        name:
          type: string
          description: Template name suggested by the AI (editable in the preview).
        description:
          type: [string, "null"]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/NlSection"

    NlSection:
      type: object
      required: [title, fields]
      properties:
        title:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/NlField"

    NlField:
      type: object
      required: [label, type, required]
      properties:
        label:
          type: string
        type:
          type: string
          enum: [text, textarea, number, select, radio, checkbox, date, datetime, file, user-picker]
        required:
          type: boolean
        options:
          type: array
          items:
            type: string
          description: Choice types only (select/radio/checkbox).

    NlGenerateRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: The natural-language form description.

    NlGenerateResponse:
      type: object
      required: [suggestion]
      properties:
        suggestion:
          oneOf:
            - $ref: "#/components/schemas/FormStructureSuggestion"
            - type: "null"
          description: The generated suggestion, or null when nothing matched.

    NlRefineRequest:
      type: object
      required: [message, suggestion]
      properties:
        message:
          type: string
          description: The follow-up instruction (e.g. "去掉附件、加上到货日期").
        suggestion:
          $ref: "#/components/schemas/FormStructureSuggestion"

    NlRefineResponse:
      type: object
      required: [suggestion]
      properties:
        suggestion:
          $ref: "#/components/schemas/FormStructureSuggestion"

  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      description: Correlation ID propagated across logs and echoed in responses.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated key for idempotent writes (24h window, ADR-0002).
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      description: CSRF token required for mutating methods; read from the xsrf-token cookie.
      schema:
        type: string
    TemplateId:
      name: id
      in: path
